
[project]
name = "hats-registry"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Doug Branton", email = "dougrbranton@gmail.com" }
]
description = "The HATS Registry is a centralized repository for known HATS catalogs"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
hats
]

[project.urls]
"Source Code" = "https://github.com/dougbrn/hats-registry"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "black", # Used for static linting of files
    "jupyter", # Clears output from Jupyter notebooks
    "mypy", # Used for static type checking of files
    "pre-commit", # Used to run checks before finalizing a git commit
    "pylint", # Used for static linting of files
    "pytest",
    "pytest-cov", # Used to report total code coverage
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/hats_registry/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"

[tool.black]
line-length = 110
[tool.isort]
profile = "black"
line_length = 110

[tool.mypy]
python_version = "3.11"
[tool.setuptools.package-data]
hats_registry = ["py.typed"]

[tool.coverage.run]
omit=["src/hats_registry/_version.py"]
